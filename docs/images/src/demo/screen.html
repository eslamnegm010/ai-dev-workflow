<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0;padding:0}body{width:402px;height:874px;font-family:-apple-system,Arial,sans-serif;background:#FAF7F2;color:#1F1B16}
.top{padding:62px 20px 14px;display:flex;justify-content:space-between;align-items:center}
.top h1{font-size:26px;font-weight:800}.av{width:36px;height:36px;border-radius:50%;background:#D9532B}
.tabs{display:flex;gap:8px;padding:6px 20px 16px}.tab{padding:8px 14px;border-radius:999px;border:1.5px solid #1F1B16;font-size:14px;font-weight:600}.tab.on{background:#1F1B16;color:#FAF7F2}
.card{margin:0 20px 14px;background:#fff;border-radius:16px;padding:16px;border:1px solid #E6DCCB}
.row{display:flex;gap:10px;align-items:center}.dot{width:34px;height:34px;border-radius:50%;background:#3E6B48}
.name{font-weight:700;font-size:15px}.meta{font-size:12px;color:#6B6156}
.body{font-size:15px;line-height:1.45;margin-top:10px}
.img{height:150px;border-radius:12px;background:linear-gradient(135deg,#E9B44C,#D9532B);margin-top:12px}
.btn{margin-top:12px;display:inline-block;padding:10px 16px;border-radius:10px;background:#1F1B16;color:#fff;font-weight:700;font-size:14px}
.nav{position:absolute;bottom:0;left:0;right:0;height:84px;border-top:1px solid #E6DCCB;background:#fff;display:flex;justify-content:space-around;padding-top:14px}
.nav i{width:26px;height:26px;border-radius:8px;background:#D9CDBA}.nav i.on{background:#1F1B16}
/*DRIFT*/
</style></head><body>
<div class="top"><h1>Home</h1><div class="av"></div></div>
<div class="tabs"><div class="tab on">All</div><div class="tab">Following</div><div class="tab">Saved</div></div>
<div class="card"><div class="row"><div class="dot"></div><div><div class="name">Design Team</div><div class="meta">2h · Announcement</div></div></div>
<div class="body">The new onboarding screens are ready for review. Comments welcome before Friday.</div><div class="img"></div><div class="btn">Open file</div></div>
<div class="card"><div class="row"><div class="dot" style="background:#E9B44C"></div><div><div class="name">Mona</div><div class="meta">5h · Question</div></div></div>
<div class="body">Does anyone have last week's notes?</div></div>
<div class="nav"><i class="on"></i><i></i><i></i><i></i></div>
</body></html>
